name: ci

# Mirrors devops/products/common/acados/.github/workflows/ci.yml: native host
# runners per architecture, the per-distribution builder image via `docker run`,
# a real install + runtime smoke on the runner itself, and a trusted build
# manifest that the central release-orchestrator consumes. No cross-built deb is
# ever installed on a foreign architecture and nothing is masked.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# SUPPORT MATRIX (explicit, no fabricated passes)
#   C SDK (libzenohc + zenoh-cpp headers): bionic, focal, jammy, noble x amd64, arm64.
#     Every row builds natively on its own runner and installs + runs a pub/sub round
#     trip there. A row is Open until its own CI job is green; nothing is masked.
#   Python consumer binding: only where a Python consumer actually exists.
#     focal / py3.8 / amd64 and focal / py3.8 / arm64  -> supported (built + interop gate)
#     bionic -> NO Python consumer (python3.6 only); the C SDK ships alone, and no
#       rospy/runtime adaptation is fabricated here. If a bionic consumer is ever
#       required, CI must supply that runtime formally.
#     jammy / noble -> OPEN: no consumer runtime pinned yet; C SDK only.
python_consumer_rows: focal

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - id: rows
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          rows = []
          # acados REAL native multiarch rows: the same image tag resolves per
          # runner architecture, so an arm64 runner builds natively.
          for distro, image in (
              ("bionic", "ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-dev:1.0.0"),
              ("focal", "ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0"),
              ("jammy", "ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0"),
              ("noble", "ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0"),
          ):
              for arch, runner in (("amd64", "ubuntu-latest"), ("arm64", "ubuntu-24.04-arm")):
                  rows.append({"distribution": distro, "arch": arch, "runner": runner, "image": image})
          print("rows=" + json.dumps(rows))
          PY

  deb-build-and-smoke:
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.rows) }}
    steps:
      - uses: actions/checkout@v4
      - name: verify frozen pins
        run: |
          sha256sum -c <<<"$(sed -n 's/^CARGO_LOCK_SHA256=//p' zenoh.lock)  .xgc2/zenoh-c-1.8.0/Cargo.lock"
          sha256sum -c <<<"$(sed -n 's/^OPAQUE_CARGO_LOCK_SHA256=//p' zenoh.lock)  .xgc2/zenoh-c-1.8.0/opaque-Cargo.lock"
      - name: build prefix and package (native, inside the distribution image)
        run: |
          install -d .ci/build-manifests
          # The images declare no ENTRYPOINT (Cmd=[bash]); the shell is explicit.
          docker run --rm --network host --entrypoint bash \
            --mount "type=bind,src=${PWD},dst=/w" -w /w \
            "${{ matrix.image }}" -euo pipefail -c '
              .xgc2/scripts/build_zenoh_cross.sh --out /w/.ci/prefix --arch "${{ matrix.arch }}"
              if [[ "${{ matrix.distribution }}" == "focal" ]]; then
                .xgc2/scripts/build_python_binding.sh --python 3.8 --arch "${{ matrix.arch }}" --out /w/.ci/py
                ZENOH_PYTHON_WHEEL_DIR=/w/.ci/py .xgc2/scripts/build_deb.sh \
                  --prefix /w/.ci/prefix/zenoh-${{ matrix.arch }} --arch "${{ matrix.arch }}" --output /w/.ci/debs
              else
                # No Python consumer on this distribution: the C SDK ships alone.
                .xgc2/scripts/build_deb.sh \
                  --prefix /w/.ci/prefix/zenoh-${{ matrix.arch }} --arch "${{ matrix.arch }}" --output /w/.ci/debs
              fi
            '
      - name: compliance
        run: ./.xgc2/scripts/check_package_compliance.sh "$PWD/.ci/debs"
      - name: install on this architecture and run real pub/sub
        run: |
          sudo dpkg -i .ci/debs/*.deb
          # Native execution: the installed library must load, link and complete a
          # session round trip on this runner architecture.
          .xgc2/scripts/smoke_pubsub.sh /opt/xgc2/zenoh
          if [[ "${{ matrix.distribution }}" == "focal" ]]; then
            python3 -c "import zenoh; print('zenoh python binding', zenoh.__version__)"
          else
            echo "C SDK only on ${{ matrix.distribution }} (no Python consumer)"
          fi
      - name: trusted build manifest
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir .ci/debs --output-dir .ci/build-manifests \
            --product xgc2-zenoh \
            --product-version "$(sed -n 's/^version:[[:space:]]*//p' .xgc2/product.yml | head -n1)" \
            --distribution "${{ matrix.distribution }}" --architecture "${{ matrix.arch }}" \
            --source-sha "${GITHUB_SHA}" --ci-run-id "${GITHUB_RUN_ID}" \
            --ci-workflow "${GITHUB_WORKFLOW}" --ci-workflow-ref "${GITHUB_REF}"
      - uses: actions/upload-artifact@v4
        with:
          name: xgc2-zenoh-${{ matrix.distribution }}-${{ matrix.arch }}
          path: |
            .ci/debs/*.deb
            .ci/build-manifests/*
