name: release

# Mirrors the acados release contract consumed by the central release-orchestrator
# (xgc2-apt-release). The orchestrator supplies the expected version/source and the
# dependency-set digest; publication itself is the central APT step, not a
# repo-local uploader.
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA of this repository
        required: true
        type: string
      prepare_action:
        description: Release-train action
        required: false
        default: release
        type: choice
        options:
          - release
          - compatibility-verify
      apt_overlay_url:
        description: Optional release-scoped staging APT base URL
        required: false
        default: ""
        type: string
      dependency_set_digest:
        description: SHA256 of the resolved release-train dependency set
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert expected version, source and dependency set
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' .xgc2/product.yml | head -n1)"
          test "${version}" = "${{ inputs.expected_version }}" || { echo "product version ${version} != expected ${{ inputs.expected_version }}" >&2; exit 1; }
          head="$(git rev-parse HEAD)"
          test "${head}" = "${{ inputs.expected_source_sha }}" || { echo "HEAD ${head} != expected ${{ inputs.expected_source_sha }}" >&2; exit 1; }
          if [[ -n "${XGC2_APT_OVERLAY_URL}" ]]; then
            test -n "${XGC2_DEPENDENCY_SET_DIGEST}" || { echo 'apt_overlay_url requires a dependency_set_digest' >&2; exit 1; }
          fi
          if [[ "${{ inputs.prepare_action }}" == "compatibility-verify" ]]; then
            echo 'compatibility-verify: no publication, contract checked only'
          fi

  build:
    needs: contract
    if: ${{ inputs.prepare_action == 'release' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Same native support matrix as ci.yml: every row builds inside its own
        # distro container. bionic rows stay declared OPEN: they fail explicitly
        # at the cmake floor until the xgc2-images bionic toolchain ships
        # cmake >= 3.16 (image-side supply, never a product bootstrap).
        include:
          - arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-dev:1.0.0
            distribution: bionic
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-dev:1.0.0
            distribution: bionic
          - arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
            distribution: focal
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
            distribution: focal
          - arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
            distribution: jammy
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
            distribution: jammy
          - arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
            distribution: noble
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
            distribution: noble
    steps:
      - uses: actions/checkout@v4
      - name: verify frozen pins
        run: |
          sha256sum -c <<<"$(sed -n 's/^CARGO_LOCK_SHA256=//p' zenoh.lock)  .xgc2/zenoh-c-1.8.0/Cargo.lock"
          sha256sum -c <<<"$(sed -n 's/^OPAQUE_CARGO_LOCK_SHA256=//p' zenoh.lock)  .xgc2/zenoh-c-1.8.0/opaque-Cargo.lock"
      - name: build, package, install and smoke INSIDE the target container
        run: |
          install -d .ci/build-manifests
          docker run --rm --network host --entrypoint bash \
            --mount "type=bind,src=${PWD},dst=/w" -w /w \
            -e PACKAGE_DISTRIBUTION="${{ matrix.distribution }}" \
            "${{ matrix.image }}" -euo pipefail -c '
              .xgc2/scripts/build_zenoh.sh --out /w/.ci/prefix --jobs "$(nproc)"
              if [[ "${{ matrix.distribution }}" == "focal" ]]; then
                .xgc2/scripts/build_python_binding.sh --python 3.8 --arch "${{ matrix.arch }}" --out /w/.ci/py
                ZENOH_PYTHON_WHEEL_DIR=/w/.ci/py .xgc2/scripts/build_deb.sh \
                  --prefix /w/.ci/prefix/zenoh-${{ matrix.arch }} --arch "${{ matrix.arch }}" --output /w/.ci/debs
              else
                .xgc2/scripts/build_deb.sh \
                  --prefix /w/.ci/prefix/zenoh-${{ matrix.arch }} --arch "${{ matrix.arch }}" --output /w/.ci/debs
              fi
              dpkg -i /w/.ci/debs/*.deb
              .xgc2/scripts/smoke_pubsub.sh /opt/xgc2/zenoh
              if [[ "${{ matrix.distribution }}" == "focal" ]]; then
                python3 -c "import importlib.metadata, sys, zenoh; v=importlib.metadata.version(\"eclipse-zenoh\"); assert v == \"1.8.0\", v; print(\"zenoh python binding\", v, \"on\", sys.version.split()[0])"
                .xgc2/scripts/python_interop_gate.sh --prefix /opt/xgc2/zenoh --python 3.8
              else
                echo "C SDK only on ${{ matrix.distribution }} (no Python consumer)"
              fi
            '
      - name: compliance
        run: ./.xgc2/scripts/check_package_compliance.sh "$PWD/.ci/debs"
      - name: trusted build manifest
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir .ci/debs --output-dir .ci/build-manifests \
            --product xgc2-zenoh \
            --product-version "$(sed -n 's/^version:[[:space:]]*//p' .xgc2/product.yml | head -n1)" \
            --distribution "${{ matrix.distribution }}" --architecture "${{ matrix.arch }}" \
            --source-sha "${GITHUB_SHA}" --ci-run-id "${GITHUB_RUN_ID}" \
            --ci-workflow "${GITHUB_WORKFLOW}" --ci-workflow-ref "${GITHUB_REF}"
      - uses: actions/upload-artifact@v4
        with:
          name: xgc2-zenoh-${{ matrix.distribution }}-${{ matrix.arch }}
          path: |
            .ci/debs/*.deb
            .ci/build-manifests/*
