schema: xgc2.product.v1
id: xgc2-zenoh
name: XGC2 Zenoh SDK
version: 1.10.2-1
kind: toolchain-apt
summary: Official Zenoh 1.10.2 C/C++ SDK and zenohd built from locked source
  in each target distribution and architecture, with the matching Python binding.
apt:
  distribution: bionic,focal,jammy,noble
  install:
  - xgc2-zenoh
  packages:
  - xgc2-zenoh
  # build_deb.sh selects libgcc1 on Bionic and libgcc-s1 elsewhere. Focal and
  # Noble use their system Python; Bionic owns an isolated CPython prefix.
  # Jammy retains its existing C SDK/daemon-only support.
  depends:
  - libc6
  - libstdc++6
usage:
  install: 'sudo apt update

    sudo apt install xgc2-zenoh

    '
  smoke_test: 'test -f /opt/xgc2/zenoh/include/zenoh.h && test -f /opt/xgc2/zenoh/include/zenoh.hxx
    && test -x /opt/xgc2/zenoh/bin/zenohd
    && test -f /opt/xgc2/zenoh/lib/libzenohc.so && test -f /opt/xgc2/zenoh/lib/libzenohc.a
    && test -f /opt/xgc2/zenoh/lib/cmake/zenohc/zenohcConfig.cmake
    && test -f /opt/xgc2/zenoh/lib/cmake/zenohcxx/zenohcxxConfig.cmake
    && d=$(mktemp -d) && printf "%s\n" "cmake_minimum_required(VERSION 3.16)" "project(p C CXX)" "find_package(zenohc 1.10.2 EXACT CONFIG REQUIRED)" "find_package(zenohcxx 1.10.2 EXACT CONFIG REQUIRED)" > "$d/CMakeLists.txt" && cmake -S "$d" -B "$d/build" && rm -rf "$d"'
  notes: 'The C/C++ SDK and official zenohd share /opt/xgc2/zenoh. Sources,
    archive hashes, Cargo locks and compiler identity are recorded in zenoh.lock.
    Native builds preserve the target distribution GLIBC baseline. The installed
    C++ CMake export supports CMake 3.16 imported-target aliases. Focal uses system
    Python 3.8 and Noble system Python 3.12; Bionic carries its separate CPython
    3.12.12 at /opt/xgc2/zenoh/python with /opt/xgc2/zenoh/bin/python as the explicit
    entry, leaving system Python 3.6 unchanged. Jammy remains C SDK/daemon-only.
    Installed C/C++ pub/sub, router lifecycle and Python interoperability are
    exercised in the matching distribution containers.'
ownership:
  paths:
  - /opt/xgc2/zenoh
  - /usr/lib/cmake/xgc2_zenoh
  - /usr/lib/cmake/zenohc
  - /usr/lib/cmake/zenohcxx
  - /usr/lib/python3/dist-packages/zenoh
  - /usr/lib/python3/dist-packages/eclipse_zenoh-1.10.2.dist-info
  - /etc/ld.so.conf.d/xgc2-zenoh.conf
release:
  apt_versions:
    bionic: 1.10.2-1~bionic
    focal: 1.10.2-1~focal
    jammy: 1.10.2-1~jammy
    noble: 1.10.2-1~noble
conflicts:
  apt_packages: []
